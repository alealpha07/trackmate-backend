<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TrackMate</title>
    <link rel="icon" href="/img/icon.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="/theme.css">
</head>
<body class="center-page">
    <main class="card auth">
        <img class="logo" src="/img/icon.webp" alt="TrackMate">
        <h1 data-i18n="register.title"></h1>
        <p class="subtitle muted" data-i18n="register.subtitle"></p>
        <form data-mode="register">
            <div>
                <label for="username" data-i18n="auth.username"></label>
                <input id="username" name="username" autocomplete="username" required>
            </div>
            <div>
                <label for="password" data-i18n="auth.password"></label>
                <input id="password" name="password" type="password" autocomplete="new-password" required>
            </div>
            <div>
                <label for="confirmPassword" data-i18n="auth.confirmPassword"></label>
                <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
            </div>
            <p id="error" class="error" role="alert" hidden></p>
            <button class="button" type="submit" data-i18n="register.submit"></button>
        </form>
        <p class="switch muted"><span data-i18n="register.switch"></span> <a href="/login" data-i18n="register.switchLink"></a></p>
    </main>
    <script type="module" src="/js/auth.js"></script>
</body>
</html>
